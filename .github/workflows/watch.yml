name: Watch Summer 2027 Internships

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: internship-readme-watcher
  cancel-in-progress: false

jobs:
  check-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout watcher repository
        uses: actions/checkout@v4

      - name: Get latest README commit
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESPONSE=$(curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/SimplifyJobs/Summer2027-Internships/commits?sha=dev&path=README.md&per_page=1")

          SHA=$(echo "$RESPONSE" | jq -r '.[0].sha')
          MESSAGE=$(echo "$RESPONSE" | jq -r '.[0].commit.message' | head -n 1)

          if [ -z "$SHA" ] || [ "$SHA" = "null" ]; then
            echo "Could not find the latest README commit."
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "message=$MESSAGE" >> "$GITHUB_OUTPUT"

      - name: Compare with previous version
        id: compare
        env:
          LATEST_SHA: ${{ steps.latest.outputs.sha }}
        run: |
          if [ ! -f state/last-sha.txt ]; then
            echo "first_run=true" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREVIOUS_SHA=$(cat state/last-sha.txt)

          if [ "$LATEST_SHA" = "$PREVIOUS_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send iPhone notification
        if: steps.compare.outputs.changed == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          COMMIT_MESSAGE: ${{ steps.latest.outputs.message }}
        run: |
          curl --fail --silent --show-error \
            -H "Title: New Summer 2027 internships" \
            -H "Priority: high" \
            -H "Tags: briefcase" \
            -H "Click: https://github.com/SimplifyJobs/Summer2027-Internships" \
            -d "The internship README was updated: $COMMIT_MESSAGE" \
            "https://ntfy.sh/$NTFY_TOPIC"

      - name: Save latest README version
        if: steps.compare.outputs.changed == 'true' || steps.compare.outputs.first_run == 'true'
        env:
          LATEST_SHA: ${{ steps.latest.outputs.sha }}
        run: |
          mkdir -p state
          echo "$LATEST_SHA" > state/last-sha.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/last-sha.txt
          git commit -m "Update tracked README version"
          git push